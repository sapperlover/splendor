[build-system]
requires = ["setuptools>=69", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "splendor-engine"
version = "0.1.0"
description = "Two-player Splendor rules engine and AI"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.0", "tensorboard>=2.20"]

[project.optional-dependencies]
bga = ["playwright>=1.60,<2"]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
splendor = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
